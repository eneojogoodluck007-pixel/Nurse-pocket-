 if(tab=="m")h=M.map(x=>has(x[0],x[1])?`<div class="bx"><h3>${x[0]}</h3>${x[1]}</div>`:"").join("")||"<p>No terms found.</p>";
 if(tab=="d")h=G.map(x=>has(...x)?`<div class="bx"><h3>${x[0]}</h3><b>Class:</b> ${x[1]}<br><b>Uses:</b> ${x[2]}<br><b>Nursing points:</b> ${x[3]}</div>`:"").join("")||"<p>No drugs found.</p>";
 if(tab=="c")h="<h2>Calculators</h2>"+K.map(k=>`<div class="bx" id="k${k.f}"><h3>${k.n}</h3>${k.e.map(l=>`<label>${l}<input class="n" type="number" step="any" inputmode="decimal"></label>`).join("")}<button class="go" onclick="calc('${k.f}')">Calculate</button><div class="rs" hidden></div></div>`).join("");
 if(tab=="z"){
  if(qi>=Z.length)h=`<div class="bx"><h3>Quiz complete</h3>You scored ${sc} out of ${Z.length}.<br><button class="go" onclick="qi=0;sc=0;ans=null;show()">Try again</button></div>`;
  else{let z=Z[qi];h=`<div class="bx"><h3>Question ${qi+1} of ${Z.length}</h3>${z[0]}${z[1].map((o,k)=>`<button class="op ${ans!=null?(k==z[2]?"ok":k==ans?"no":""):""}" ${ans!=null?"disabled":""} onclick="pick(${k})">${o}</button>`).join("")}${ans!=null?`<button class="go" onclick="qi++;ans=null;show()">Next</button>`:""}</div>`}}
 V.innerHTML=h}
function calc(f){let k=K.find(x=>x.f==f),b=$("k"+f),v=[...b.querySelectorAll("input")].map(i=>parseFloat(i.value)),o=b.querySelector(".rs");
 o.hidden=false;o.textContent=v.some(x=>isNaN(x)||x<=0)&&f!="tmp"||v.some(isNaN)?"Fill in every box with valid numbers.":k.x(...v)}
function pick(k){ans=k;if(k==Z[qi][2])sc++;show()}
show();
</script></body></html>
