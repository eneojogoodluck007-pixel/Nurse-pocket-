<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NurseWise – Nursing Study App</title>
<style>
:root{--bg:#f2f7f8;--cd:#fff;--tx:#12242b;--mu:#58707a;--pr:#0b7a75;--sf:#dff2f0;--bd:#d3e2e6;--ac:#d94452;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f;--cd:#16262d;--tx:#e6f1f3;--mu:#98b1b9;--pr:#45c9c1;--sf:#14373a;--bd:#27414a;--ac:#ff7b88;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1f;--cd:#16262d;--tx:#e6f1f3;--mu:#98b1b9;--pr:#45c9c1;--sf:#14373a;--bd:#27414a;--ac:#ff7b88;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
header{padding:20px 16px 8px}h1{font-size:30px;color:var(--pr)}header p{margin:2px 0 0;color:var(--mu);font-size:14px}
main{padding:8px 16px;max-width:720px;margin:auto}
#q{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit;margin:8px 0 12px}
#q:focus,button:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;color:var(--tx);font:inherit;cursor:pointer}
.it b{display:block}.it small{color:var(--mu)}.em{font-size:26px}
.bx{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:8px;padding:12px 14px;margin:10px 0}
.bx h3{font-size:17px;margin-bottom:4px}ul{margin:4px 0;padding-left:20px}
.bk{background:none;border:0;color:var(--pr);font:inherit;font-weight:600;padding:8px 0;cursor:pointer}
.fl{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin:8px 0}
.fl div{color:#fff;padding:9px 12px;border-radius:8px;text-align:center;font-weight:600;font-size:15px}.fl i{text-align:center;color:var(--mu);font-style:normal;line-height:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:4px 0;cursor:pointer}nav button span{display:block;font-size:22px}nav .on{color:var(--pr);font-weight:700}
label{display:block;font-size:14px;color:var(--mu);margin-top:8px}input.n{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.go{background:var(--pr);color:var(--bg);border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:700;margin-top:12px;cursor:pointer}
.rs{margin-top:10px;padding:10px;background:var(--sf);border-radius:8px;font-weight:600}
.op{display:block;width:100%;text-align:left;background:var(--cd);border:1.5px solid var(--bd);border-radius:8px;padding:10px;margin-top:8px;color:var(--tx);font:inherit;cursor:pointer}
.ok{border-color:#1f9d55;background:#1f9d5522}.no{border-color:var(--ac);background:#d9445222}
.dc{font-size:13px;color:var(--mu);margin-top:16px}
</style></head><body>
<header><h1>🩺 NurseWise</h1><p>Your nursing study companion</p></header>
